<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblog - 博客系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            background: #120f17;
            color: #e8e6f0;
        }

        /* ===== Micro Slats 容器（tuo.txt 的 .micro-slats 样式）===== */
        .hero {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #120f17;
        }
        #slats {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            transform: translateY(-40px);
        }
        .hero-content h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #c084fc, #60a5fa, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 18px rgba(168,85,247,.45));
            margin-bottom: 12px;
        }
        .hero-content p {
            color: rgba(232,230,240,.65);
            font-size: 16px;
        }

        /* ===== 内容区 ===== */
        .container { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }

        .stats { display: flex; gap: 16px; margin-bottom: 28px; }
        .stat-card {
            flex: 1;
            background: #1a1622;
            border: 1px solid rgba(168,85,247,.15);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            transition: border-color .2s;
        }
        .stat-card:hover { border-color: rgba(168,85,247,.5); }
        .stat-card .num { font-size: 28px; font-weight: 700; color: #c084fc; }
        .stat-card .label { font-size: 13px; color: #8a8496; margin-top: 4px; }

        .blog-card {
            background: #1a1622;
            border: 1px solid rgba(168,85,247,.12);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 16px;
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
            cursor: pointer;
        }
        .blog-card:hover {
            transform: translateY(-2px);
            border-color: rgba(168,85,247,.55);
            box-shadow: 0 8px 28px rgba(168,85,247,.15);
        }
        .blog-card h2 { font-size: 19px; margin-bottom: 8px; color: #f0eef8; }
        .blog-card .summary {
            font-size: 14px;
            color: #a09aae;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .blog-card .meta {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #6f6880;
        }
        .tag {
            background: rgba(168,85,247,.14);
            color: #c084fc;
            padding: 2px 10px;
            border-radius: 10px;
        }
        .loading { text-align: center; padding: 40px; color: #8a8496; }

        /* ===== 主栏 + 侧栏布局 ===== */
        .layout { display: grid; grid-template-columns: 1fr 260px; gap: 24px; align-items: start; }
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .hero { height: 420px; }
            .hero-content h1 { font-size: 30px; }
            .lanyard-wrap { height: 380px; flex-direction: column; }
            #crystal-ball, #lanyard { flex: 1; min-height: 180px; }
            .stats { flex-wrap: wrap; gap: 12px; }
            .stat-card { min-width: calc(50% - 6px); padding: 16px 12px; }
            .stat-card .num { font-size: 22px; }
            .blog-card { padding: 16px 18px; }
            .blog-card h2 { font-size: 17px; }
            .blog-card .meta { flex-wrap: wrap; gap: 8px; font-size: 11px; }
            .container { padding: 20px 12px 36px; }
        }

        .panel {
            background: #1a1622;
            border: 1px solid rgba(168,85,247,.12);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .panel h3 {
            font-size: 14px;
            color: #c084fc;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel h3::before {
            content: '';
            width: 4px; height: 14px;
            border-radius: 2px;
            background: linear-gradient(180deg, #a855f7, #6d28d9);
        }

        .cat-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-radius: 8px;
            font-size: 14px; color: #c9c4d6;
            transition: background .15s;
        }
        .cat-item:hover { background: rgba(168,85,247,.1); }
        .cat-item .cnt {
            font-size: 12px; color: #8a8496;
            background: rgba(168,85,247,.14);
            padding: 1px 8px; border-radius: 9px;
        }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
        .cloud-tag {
            background: rgba(168,85,247,.12);
            border: 1px solid rgba(168,85,247,.25);
            color: #c084fc;
            padding: 4px 12px; border-radius: 12px;
            transition: border-color .15s, transform .15s;
        }
        .cloud-tag:hover { border-color: rgba(168,85,247,.7); transform: translateY(-1px); }
        .cloud-tag .cnt { font-size: 11px; color: #8a8496; margin-left: 4px; }

        .section-title {
            font-size: 17px; color: #f0eef8; margin: 0 0 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::before {
            content: ''; width: 4px; height: 16px; border-radius: 2px;
            background: linear-gradient(180deg, #a855f7, #6d28d9);
        }

        .comment-item {
            background: #1a1622;
            border: 1px solid rgba(168,85,247,.12);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .comment-item .head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 13px;
        }
        .comment-item .who { color: #c084fc; font-weight: 600; }
        .comment-item .time { color: #6f6880; font-size: 12px; }
        .comment-item .text { font-size: 14px; color: #c9c4d6; line-height: 1.7; }
        .comment-item .from { font-size: 12px; color: #6f6880; margin-top: 8px; }

        .link-cloud { display: flex; flex-wrap: wrap; gap: 12px; }
        .link-item {
            display: inline-flex; align-items: center; gap: 8px;
            background: #1a1622;
            border: 1px solid rgba(168,85,247,.15);
            border-radius: 10px;
            padding: 10px 18px;
            color: #c9c4d6; font-size: 14px;
            text-decoration: none;
            transition: border-color .15s, transform .15s;
        }
        .link-item:hover { border-color: rgba(168,85,247,.55); transform: translateY(-2px); color: #e8e6f0; }
        .link-item::before {
            content: ''; width: 6px; height: 6px;
            border-radius: 50%;
            background: #a855f7;
        }

        /* ===== 关于博主 ===== */
        .about-panel { text-align: center; }
        .about-card { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #6d28d9);
            color: #fff;
            font-size: 22px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(168,85,247,.4);
        }
        .about-info { text-align: left; }
        .about-info .name { font-size: 16px; font-weight: 600; color: #f0eef8; }
        .about-info .major { font-size: 12px; color: #c084fc; margin-top: 2px; }
        .about-bio {
            font-size: 13px; color: #a09aae; line-height: 1.6;
            text-align: left; margin: 0;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #55505f;
            font-size: 13px;
            border-top: 1px solid rgba(168,85,247,.08);
        }
        .lanyard-wrap {
            display: flex;
            width: 100%;
            height: 420px;
            margin-bottom: 8px;
            position: relative;
            gap: 16px;
        }
        #crystal-ball {
            flex: 1;
            position: relative;
            min-width: 0;
        }
        #lanyard {
            flex: 1;
            position: relative;
            min-width: 0;
        }
        .crystalized-ball {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .lanyard {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .lanyard-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "ogl": "https://unpkg.com/ogl@0.0.77/src/index.mjs"
      }
    }
    </script>
</head>

<div class="container">
    <!-- 水晶球 + 工牌特效 -->
    <div class="lanyard-wrap">
        <div id="crystal-ball"></div>

        <div class="hero-content">

    <div class="stats">

    <div class="layout">
        <div class="main-col">

                <div class="about-card">
                    <div class="avatar" id="author-avatar">张</div>
                    <div class="about-info">
                        <div class="name" id="author-name">张良铖</div>

            <div class="panel">
                <h3>标签云</h3>
                <div id="tag-cloud" class="tag-cloud"><p class="loading" style="padding:12px">加载中...</p></div>
            </div>
        </aside>
    </div>

    <h2 class="section-title" style="margin-top:32px">最新评论</h2>
    <div id="comment-list"><p class="loading">正在加载评论...</p></div>

    <h2 class="section-title" style="margin-top:32px">友情链接</h2>
    <div id="link-list" class="link-cloud"><p class="loading">正在加载友链...</p></div>
</div>

<footer>Weblog Blog System · Powered by Spring Boot 3 + MySQL &nbsp;|&nbsp; <a href="/admin.html" style="color:#8a8496;">后台管理</a></footer>

<script>
/* ================================================================
 * Micro Slats —— ReactBits 官方组件原版移植
 * 移植自 one.txt（MicroSlats.jsx）：去掉 React 与 ogl 依赖，
 * 着色器与算法逻辑保持 100% 原样，参数来自 tr.txt
 * ================================================================ */
(() => {
    'use strict';

    const container = document.getElementById('slats-wrap');
    const canvas = document.getElementById('slats');

    const gl = canvas.getContext('webgl2', {
        alpha: true, premultipliedAlpha: true, antialias: false, depth: false
    });
    if (!gl) { console.warn('WebGL2 unavailable, Micro Slats disabled'); return; }

    /* ---------- 参数（tr.txt 官方示例） ---------- */
    const settings = {
        color: parseColor('#A855F7', [0.66, 0.33, 0.97, 1]),
        glintColor: parseColor('#ffffff', [1, 1, 1, 1]),
        backgroundColor: parseColor('#120f17', [0, 0, 0, 1]),
        slatWidth: 10, slatHeight: 25, gap: 3, roundness: 0.75,
        scale: 1.5, speed: 0.6, direction: 250, chop: 0.55,
        stretch: 0, glint: 0.7, contrast: 1.25, perspective: 0.55, fog: 0.55,
        interactive: true, cursorStrength: 1, cursorSize: 40,
        swirl: 0, trail: 1.4, lean: 0,
        intro: true, introDuration: 1.5, paused: false
    };

    const FLUID_SIZE = 96;
    const PRESSURE_STEPS = 16;
    const SPLAT_FORCE = 6900;
    const SPLASH_JETS = 3;
    const PIXEL_BUDGET = 4.5e6;

    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

    function parseColor(value, fallback) {
        try {
            const ctx = document.createElement('canvas').getContext('2d');
            if (!ctx) return fallback;
            ctx.fillStyle = '#000000';
            ctx.fillStyle = value;
            const resolved = ctx.fillStyle;
            if (resolved.startsWith('#')) {
                const n = parseInt(resolved.slice(1), 16);
                return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
            }
            const parts = resolved.match(/[\d.]+/g);
            if (!parts || parts.length < 3) return fallback;
            return [Number(parts[0]) / 255, Number(parts[1]) / 255, Number(parts[2]) / 255, parts[3] ? Number(parts[3]) : 1];
        } catch { return fallback; }
    }

    /* ---------- 着色器（one.txt 原样移植） ---------- */
    const passVertex = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

    const fluidVertex = `#version 300 es
in vec2 position;
uniform vec2 uTexel;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
void main() {
  vUv = position * 0.5 + 0.5;
  vL = vUv - vec2(uTexel.x, 0.0);
  vR = vUv + vec2(uTexel.x, 0.0);
  vT = vUv + vec2(0.0, uTexel.y);
  vB = vUv - vec2(0.0, uTexel.y);
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

    const fluidHead = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 fragColor;
`;

    const splatFragment = `${fluidHead}
uniform sampler2D uTarget;
uniform float uAspect;
uniform vec2 uPoint;
uniform vec3 uValue;
uniform float uRadius;
void main() {
  vec2 offset = vUv - uPoint;
  offset.x *= uAspect;
  float falloff = exp(-dot(offset, offset) / uRadius);
  fragColor = vec4(texture(uTarget, vUv).xyz + uValue * falloff, 1.0);
}
`;

    const curlFragment = `${fluidHead}
uniform sampler2D uVelocity;
void main() {
  float left = texture(uVelocity, vL).y;
  float right = texture(uVelocity, vR).y;
  float top = texture(uVelocity, vT).x;
  float bottom = texture(uVelocity, vB).x;
  fragColor = vec4(0.5 * (right - left - top + bottom), 0.0, 0.0, 1.0);
}
`;

    const vorticityFragment = `${fluidHead}
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float uSwirl;
uniform float uDt;
void main() {
  float left = texture(uCurl, vL).x;
  float right = texture(uCurl, vR).x;
  float top = texture(uCurl, vT).x;
  float bottom = texture(uCurl, vB).x;
  float middle = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(top) - abs(bottom), abs(right) - abs(left));
  force = force / (length(force) + 0.0001) * uSwirl * middle;
  force.y = -force.y;
  vec2 velocity = texture(uVelocity, vUv).xy + force * uDt;
  fragColor = vec4(clamp(velocity, -1000.0, 1000.0), 0.0, 1.0);
}
`;

    const divergenceFragment = `${fluidHead}
uniform sampler2D uVelocity;
void main() {
  vec2 middle = texture(uVelocity, vUv).xy;
  float left = vL.x < 0.0 ? -middle.x : texture(uVelocity, vL).x;
  float right = vR.x > 1.0 ? -middle.x : texture(uVelocity, vR).x;
  float top = vT.y > 1.0 ? -middle.y : texture(uVelocity, vT).y;
  float bottom = vB.y < 0.0 ? -middle.y : texture(uVelocity, vB).y;
  fragColor = vec4(0.5 * (right - left + top - bottom), 0.0, 0.0, 1.0);
}
`;

    const pressureFragment = `${fluidHead}
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main() {
  float left = texture(uPressure, vL).x;
  float right = texture(uPressure, vR).x;
  float top = texture(uPressure, vT).x;
  float bottom = texture(uPressure, vB).x;
  float divergence = texture(uDivergence, vUv).x;
  fragColor = vec4((left + right + top + bottom - divergence) * 0.25, 0.0, 0.0, 1.0);
}
`;

    const projectFragment = `${fluidHead}
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main() {
  float left = texture(uPressure, vL).x;
  float right = texture(uPressure, vR).x;
  float top = texture(uPressure, vT).x;
  float bottom = texture(uPressure, vB).x;
  vec2 velocity = texture(uVelocity, vUv).xy - vec2(right - left, top - bottom);
  fragColor = vec4(velocity, 0.0, 1.0);
}
`;

    const advectFragment = `${fluidHead}
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 uTexel;
uniform float uDt;
uniform float uFade;
void main() {
  vec2 from = vUv - uDt * texture(uVelocity, vUv).xy * uTexel;
  fragColor = texture(uSource, from) / (1.0 + uFade * uDt);
}
`;

    const scaleFragment = `${fluidHead}
uniform sampler2D uSource;
uniform float uValue;
void main() {
  fragColor = texture(uSource, vUv) * uValue;
}
`;

    const fieldFragment = `#version 300 es
precision highp float;
uniform vec2 uSize;
uniform vec4 uGrid;
uniform vec2 uOrigin;
uniform vec2 uSlat;
uniform float uTime;
uniform float uScale;
uniform float uDirection;
uniform float uChop;
uniform float uStretch;
uniform float uGlint;
uniform float uContrast;
uniform float uPerspective;
uniform float uFog;
uniform float uIntro;
uniform sampler2D tVelocity;
uniform sampler2D tInk;
uniform vec2 uFluidTexel;
uniform float uFluid;
uniform float uInk;
uniform float uLean;
out vec4 fragColor;

const float TURN[4] = float[4](0.0, -0.95, 0.78, 1.62);
const float LENGTH[4] = float[4](2.6, 1.7, 1.12, 0.76);
const float HEIGHT[4] = float[4](1.0, 0.75, 0.5, 0.3);
const float SHIFT[4] = float[4](0.0, 2.3, 4.1, 1.1);

void main() {
  vec2 cell = floor(gl_FragCoord.xy);
  float row = uGrid.y - 1.0 - cell.y;
  vec2 center = uOrigin + vec2(cell.x, row) * uGrid.zw + uSlat * 0.5;
  float v = clamp(center.y / uSize.y, 0.0, 1.0);

  vec2 flow = vec2(0.0);
  float ink = 0.0;
  if (uFluid > 0.5) {
    vec2 fluidUv = clamp(vec2(center.x / uSize.x, 1.0 - center.y / uSize.y), 0.0, 1.0);
    flow = texture(tVelocity, fluidUv).xy * uFluidTexel * uSize;
    ink = texture(tInk, fluidUv).x;
  }

  float horizon = mix(8.0, 0.5, uPerspective);
  float depth = (1.0 + horizon) / (v + horizon);
  vec2 world = vec2((center.x - uSize.x * 0.5) / uSize.y * depth, (depth - 1.0) * horizon * 2.2);
  world -= flow * 0.00018 * depth;
  world /= max(uScale, 0.05);

  float meander = 0.55 * sin(dot(world, vec2(0.23, 0.41)) * 0.9 + uTime * 0.13)
    + 0.3 * sin(dot(world, vec2(-0.37, 0.19)) * 1.4 - uTime * 0.09);

  float steep = uChop * 0.45;
  float height = 0.0;
  float total = 0.0;
  for (int i = 0; i < 4; i++) {
    float angle = uDirection + TURN[i];
    vec2 heading = vec2(cos(angle), sin(angle));
    float k = 6.2831853 / LENGTH[i];
    float omega = sqrt(9.81 * k) * 0.35;
    float theta = k * dot(world, heading) - omega * uTime + SHIFT[i] + meander * (0.6 + 0.3 * float(i));
    height += HEIGHT[i] * (cos(theta) + steep * cos(2.0 * theta));
    total += HEIGHT[i] * (1.0 + steep);
  }
  float level = clamp(0.5 + 0.5 * height / (total * 0.85), 0.0, 1.0);
  float crest = smoothstep(0.6, 1.0, level);
  float glint = crest * crest * uGlint;

  float haze = mix(1.0, 1.0 - uFog, pow(1.0 - v, 1.4));
  float light = (pow(level, uContrast) + glint * 0.8) * haze;
  float glow = 1.0 - exp(-max(ink, 0.0) * uInk * 1.6);
  light = 1.0 - (1.0 - clamp(light, 0.0, 1.0)) * (1.0 - glow);

  float front = uIntro * 1.35;
  float reveal = 1.0 - smoothstep(front - 0.35, front, v);
  float sweep = exp(-pow((v - front + 0.22) / 0.07, 2.0)) * (1.0 - uIntro);
  light = (light + sweep * 0.8) * reveal;
  light = max(light, 0.045 * reveal);
  float span = mix(1.0 - uStretch, 1.0, level) + glow * 0.3;

        height = Math.max(1, container.clientHeight);
        setSize(width, height);
        buildFluid();
        start();
    }
    if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(resize).observe(container);
    } else {
        window.addEventListener('resize', resize);
    }

    resize();
})();
